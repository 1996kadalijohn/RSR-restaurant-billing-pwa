<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Sri Sai Restaurant Billing</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f8;color:#111827}button{font:inherit;cursor:pointer}.app{max-width:1250px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand h1{font-size:20px;margin:0}.brand small{color:#6b7280}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;background:#111827;color:#fff;font-weight:700}.btn.light{background:#fff;color:#111827;border:1px solid #e5e7eb}.btn.green{background:#15803d}.layout{display:grid;grid-template-columns:1.5fr .9fr;gap:14px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;box-shadow:0 2px 10px #00000008}.cats{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.cat{white-space:nowrap;border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:8px 12px}.cat.active{background:#111827;color:#fff}.search{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{background:#fafafa;border:1px solid #e5e7eb;border-radius:12px;padding:13px;text-align:left;min-height:76px}.item strong{display:block}.item span{color:#15803d;font-weight:800}.bill-head{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:10px}.bill-items{min-height:260px;max-height:48vh;overflow:auto}.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid #f0f0f0}.qty button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:7px}.totals{border-top:1px solid #ddd;margin-top:8px;padding-top:10px}.row{display:flex;justify-content:space-between;margin:7px 0}.total{font-size:23px;font-weight:900}.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.pay button{padding:10px;border:1px solid #ddd;background:#fff;border-radius:9px;font-weight:700}.pay button.active{background:#111827;color:#fff}.print{width:100%;padding:14px}.empty{text-align:center;color:#9ca3af;padding:60px 10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.stat b{display:block;font-size:22px;margin-top:5px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:700px;width:100%;max-height:85vh;overflow:auto;padding:18px}.billrow{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #eee}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:850px){.layout{grid-template-columns:1fr}.menu{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.bill-items{max-height:35vh}}.mobile-cart{display:none}@media(max-width:480px){body{background:#f3f4f6;padding-bottom:76px}.app{padding:8px;max-width:560px}.top{display:grid;grid-template-columns:1fr;gap:8px;position:sticky;top:0;z-index:20;background:#f3f4f6;padding:4px 0 8px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:17px}.brand small{font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:6px}.actions .btn{padding:10px 7px;font-size:12px;border-radius:9px}.stats{display:flex;overflow-x:auto;gap:7px;margin:0 0 8px;padding-bottom:2px;scrollbar-width:none}.stats::-webkit-scrollbar{display:none}.stat{min-width:116px;padding:10px;border-radius:11px}.stat b{font-size:18px;margin-top:3px}.layout{display:flex;flex-direction:column;gap:8px}.layout>.panel:first-child{order:1}.layout>.panel:last-child{order:2}.panel{padding:9px;border-radius:13px}.search{font-size:16px;padding:12px;margin-bottom:8px}.cats{gap:6px;padding-bottom:8px}.cat{padding:9px 13px;font-size:13px}.menu{grid-template-columns:repeat(2,1fr);gap:7px}.item{padding:11px 10px;min-height:78px;border-radius:11px}.item strong{font-size:13px;line-height:1.2}.item span{font-size:13px;display:block;margin-top:6px}.bill-head{padding-bottom:8px}.bill-items{max-height:34vh}.line{padding:10px 0}.qty button{width:34px;height:34px;font-size:18px}.pay{gap:6px}.pay button{padding:13px 7px;font-size:14px}.print{padding:15px;font-size:15px}.mobile-cart{position:fixed;display:flex;left:8px;right:8px;bottom:8px;z-index:50;background:#111827;color:#fff;border-radius:14px;padding:10px 12px;align-items:center;justify-content:space-between;box-shadow:0 8px 30px #0005}.mobile-cart .cart-info{font-size:13px}.mobile-cart .cart-total{font-size:18px;font-weight:900}.mobile-cart button{border:0;background:#fff;color:#111827;border-radius:9px;padding:10px 13px;font-weight:900}.modal{padding:8px}.modalbox{max-height:90vh;border-radius:14px;padding:12px}}@media(min-width:481px){.mobile-cart{display:none!important}}@media print{body *{visibility:hidden}.receipt,#receipt *{visibility:visible}.receipt{position:absolute;left:0;top:0;width:80mm;font-family:monospace;font-size:12px}.no-print{display:none!important}}
</style></head><body><div class="app"><div class="top"><div class="brand"><h1 id="restaurantName">SRI SAI RESTAURANT</h1><small id="clock"></small></div><div class="actions"><button class="btn light" onclick="showPrevious()">Previous Bills</button><button class="btn light" onclick="showSales()">Today's Sales</button><button class="btn" onclick="newBill()">+ New Bill</button></div></div><div class="stats"><div class="stat">Bills today<b id="billCount">0</b></div><div class="stat">Sales today<b id="salesTotal">₹0</b></div><div class="stat">Cash<b id="cashTotal">₹0</b></div><div class="stat">UPI / Card<b id="digitalTotal">₹0</b></div></div><div class="layout"><section class="panel"><input class="search" id="search" placeholder="Search menu..." oninput="renderMenu()"><div class="cats" id="cats"></div><div class="menu" id="menu"></div></section><aside class="panel"><div class="bill-head"><div><b id="billNo">Bill #1001</b><br><small id="billDate"></small></div><button class="btn light" onclick="newBill()">Clear</button></div><div id="billItems" class="bill-items"></div><div class="totals"><div class="row"><span>Subtotal</span><b id="subtotal">₹0</b></div><div class="row total"><span>Total</span><span id="total">₹0</span></div></div><div class="pay"><button data-pay="Cash" onclick="setPayment('Cash')">Cash</button><button data-pay="UPI" onclick="setPayment('UPI')">UPI</button><button data-pay="Card" onclick="setPayment('Card')">Card</button></div><button class="btn green print" onclick="completeBill()">GENERATE & PRINT</button></aside></div></div><div class="mobile-cart" id="mobileCart" onclick="scrollToBill()"><div class="cart-info"><span id="mobileCartCount">0 items</span><br><span>Tap to view bill</span></div><div class="cart-total" id="mobileCartTotal">₹0</div><button type="button">VIEW BILL</button></div><div class="modal" id="modal"><div class="modalbox"><div class="top"><h2 id="modalTitle">Previous Bills</h2><button class="btn light" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div><div id="receipt" class="receipt"></div><script>
const menu=[['Tiffin','Idly',40],['Tiffin','Dosa',50],['Tiffin','Masala Dosa',70],['Tiffin','Vada',40],['Snacks','Samosa',30],['Snacks','Onion Samosa',40],['Biryani','Chicken Biryani',220],['Biryani','Special Chicken Biryani',260],['Fried Rice','Veg Fried Rice',120],['Fried Rice','Chicken Fried Rice',160],['Fried Rice','Schezwan Chicken Fried Rice',180],['Noodles','Veg Noodles',120],['Noodles','Chicken Noodles',160],['Noodles','Schezwan Noodles',180],['Chinese Starters','Chicken 65',180],['Chinese Starters','Chilli Chicken',200],['Chinese Starters','Chicken Manchurian',200],['Chinese Starters','Gobi Manchurian',150],['Chinese Starters','Paneer 65',160],['Drinks','Water Bottle',20],['Drinks','Cool Drink',40]];
let cart={},payment='Cash',category='All';let billNo=Number(localStorage.getItem('nextBill')||1001);const money=n=>'₹'+n.toLocaleString('en-IN');
function now(){return new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})}
function renderCats(){let cats=['All',...new Set(menu.map(x=>x[0]))];document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat ${category===c?'active':''}" onclick="category='${c}';renderCats();renderMenu()">${c}</button>`).join('')}
function renderMenu(){let q=document.getElementById('search').value.toLowerCase();let items=menu.filter(x=>(category==='All'||x[0]===category)&&x[1].toLowerCase().includes(q));document.getElementById('menu').innerHTML=items.map(x=>`<button class="item" onclick="add('${x[1].replaceAll("'","\\'")}')"><strong>${x[1]}</strong><span>${money(x[2])}</span></button>`).join('')}
function add(name){cart[name]=(cart[name]||0)+1;renderBill()}
function change(name,d){cart[name]+=d;if(cart[name]<=0)delete cart[name];renderBill()}
function renderBill(){let names=Object.keys(cart);document.getElementById('billNo').textContent='Bill #'+billNo;document.getElementById('billDate').textContent=now();document.getElementById('billItems').innerHTML=names.length?names.map(n=>{let x=menu.find(m=>m[1]===n),q=cart[n];return `<div class="line"><div><b>${n}</b><br><small>${money(x[2])} × ${q} = ${money(x[2]*q)}</small></div><div class="qty"><button onclick="change('${n.replaceAll("'","\\'")}',-1)">−</button> <b>${q}</b> <button onclick="change('${n.replaceAll("'","\\'")}',1)">+</button></div></div>`}).join(''):'<div class="empty">Tap menu items to add them</div>';let total=names.reduce((s,n)=>s+menu.find(m=>m[1]===n)[2]*cart[n],0);document.getElementById('subtotal').textContent=money(total);document.getElementById('total').textContent=money(total);document.querySelectorAll('.pay button').forEach(b=>b.classList.toggle('active',b.dataset.pay===payment));let count=names.reduce((s,n)=>s+cart[n],0);document.getElementById('mobileCartCount').textContent=count+' item'+(count===1?'':'s');document.getElementById('mobileCartTotal').textContent=money(total)}
function scrollToBill(){document.querySelector('.layout>.panel:last-child').scrollIntoView({behavior:'smooth',block:'start'})}function setPayment(p){payment=p;renderBill()}function newBill(){cart={};payment='Cash';billNo=Number(localStorage.getItem('nextBill')||1001);renderBill()}
function bills(){return JSON.parse(localStorage.getItem('bills')||'[]')}function completeBill(){let names=Object.keys(cart);if(!names.length){toast('Add at least one item');return}let total=names.reduce((s,n)=>s+menu.find(m=>m[1]===n)[2]*cart[n],0);let b={no:billNo,date:new Date().toISOString(),displayDate:now(),items:names.map(n=>({name:n,qty:cart[n],price:menu.find(m=>m[1]===n)[2]})),total,payment};let a=bills();a.unshift(b);localStorage.setItem('bills',JSON.stringify(a));billNo++;localStorage.setItem('nextBill',billNo);updateStats();printReceipt(b);cart={};payment='Cash';renderBill();toast('Bill saved')}
function printReceipt(b){document.getElementById('receipt').innerHTML=`<div><b>${document.getElementById('restaurantName').textContent}</b><br>Bill #${b.no}<br>${b.displayDate}<hr>${b.items.map(i=>`${i.name}<br>${i.qty} x ${money(i.price)} = ${money(i.qty*i.price)}`).join('<br>')}<hr><b>TOTAL ${money(b.total)}</b><br>Payment: ${b.payment}<br><br>Thank You! Visit Again</div>`;window.print()}
function updateStats(){let today=new Date().toDateString(),a=bills().filter(b=>new Date(b.date).toDateString()===today),sum=k=>a.filter(b=>b.payment===k).reduce((s,b)=>s+b.total,0);document.getElementById('billCount').textContent=a.length;document.getElementById('salesTotal').textContent=money(a.reduce((s,b)=>s+b.total,0));document.getElementById('cashTotal').textContent=money(sum('Cash'));document.getElementById('digitalTotal').textContent=money(sum('UPI')+sum('Card'))}
function showPrevious(){let a=bills();document.getElementById('modalTitle').textContent='Previous Bills';document.getElementById('modalBody').innerHTML=a.length?a.slice(0,50).map(b=>`<div class="billrow"><span><b>#${b.no}</b><br><small>${b.displayDate} · ${b.payment}</small></span><span><b>${money(b.total)}</b><br><button class="btn light" onclick='printReceipt(${JSON.stringify(b)})'>Reprint</button></span></div>`).join(''):'<p>No previous bills.</p>';document.getElementById('modal').classList.add('show')}
function showSales(){let a=bills().filter(b=>new Date(b.date).toDateString()===new Date().toDateString());document.getElementById('modalTitle').textContent="Today's Sales";document.getElementById('modalBody').innerHTML=`<div class="stats"><div class="stat">Bills<b>${a.length}</b></div><div class="stat">Sales<b>${money(a.reduce((s,b)=>s+b.total,0))}</b></div><div class="stat">Cash<b>${money(a.filter(b=>b.payment==='Cash').reduce((s,b)=>s+b.total,0))}</b></div><div class="stat">UPI/Card<b>${money(a.filter(b=>b.payment!=='Cash').reduce((s,b)=>s+b.total,0))}</b></div></div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
setInterval(()=>document.getElementById('clock').textContent=now(),1000);renderCats();renderMenu();renderBill();updateStats();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
